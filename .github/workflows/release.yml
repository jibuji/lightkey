# LightKey 发布流水线（2026-08-19 新增，独立于 ci.yml 测试门禁）
#
#   - tag v* push          → 质量门禁（fmt/clippy/test/frontend）→ Windows 打包
#                            （NSIS + MSI + 独立 CLI）+ Linux CLI（lk），
#                            产物挂到 GitHub Release
#   - workflow_dispatch    → 默认行为同 tag 构建，但只留 Actions artifact；
#                            传 release_tag 输入则构建后把产物发布到该 tag 的
#                            既有 Release（用于补挂缺失附件），不移动任何标签
#
# 【2026-08-27 变更（船长裁定）：CI 只在 release 时运行】
#   原 .github/workflows/ci.yml（main push / 全部 pull_request 触发）删除，
#   全部质量检查收敛为本流水线的**构建前置门禁**——发布前必须绿：
#     - Windows job：cargo fmt --check、clippy -D warnings（三 crate）、
#       cargo test（三 crate）、前端 npm test（D 层单测）
#     - Linux job：clippy + test（lk-cli）
#
# 【2026-08-29 变更（船长裁定）：PR 恢复自动 CI，本地 no-mistakes 闸门移除】
#   触发面新增 pull_request（opened / synchronize / reopened）：提交 PR 或
#   PR 更新即自动运行同一套构建前置门禁。PR 运行属非发布路径：
#   check-version 跳过、不发布 Release、不传 artifact（省存储配额）。
#   并发组按 event+ref 隔离，PR 更新自动取消上一轮未完运行。
#
# 双 job（build-windows / build-linux-cli）并行；tag 触发时跳过 artifact 留存，
# 避免同一份产物重复上传。
# 安装包未做代码签名（暂无证书），Windows SmartScreen 未签名警告属当前预期，不阻塞发布。
# NSIS / MSI 打包器（NSIS、WiX）由 tauri-bundler 首次构建时自动下载，无需额外准备。
# 资产名版本号：tag 触发时取 tag（去 v 前缀），否则回退 tauri.conf.json 的 version。
# 版本一致性闸门（check-version job，#34）：tag / dispatch 补发路径上先校验发布 tag
# （去 v 前缀）与 crates/lk-cli 的 package version（即 CARGO_PKG_VERSION 口径，
# 当前经 workspace 继承自根 Cargo.toml）一致，不一致显式 fail，防止二进制 --version
# 与 Release tag 混淆。未带 release_tag 的 dispatch 只留 artifact，跳过校验。
# 独立 CLI（lk.exe / Linux lk）随安装包一起分发，无需安装 GUI 即可纯命令行使用。
#
# 桌面包捆绑独立 CLI（修复 cross-subsystem.md §4#7「装机目录缺失独立 CLI」）：
#   - 机制：tauri.conf.json bundle.resources 映射 ../../target/release/lk.exe →
#     安装目录根（NSIS / MSI 同样生效，资源缺失时 bundler 直接报错——顺序错误
#     会响亮失败而非静默缺文件）；
#   - 因此必须先 `cargo build --release -p lk-cli` 再 `cargo tauri build`
#     （下方步骤已按此排序；本地手动打版同样要先构建 lk-cli）。
#   - 取舍：未用 NSIS installerHooks（hook 无法把外部文件装进安装器载荷）、
#     未改 bundler 模板（侵入大）；resources 映射是声明式最小改动。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布到已存在的 Release（如 v0.1.3）；留空则只留 Actions artifact"
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

# 同一 PR 连续推送只保留最新一轮（tag / dispatch 运行不受影响：组按 event+ref 隔离）
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check release tag vs crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches lk-cli package version
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # 发布 tag：tag 触发取 ref，dispatch 补发取 release_tag 输入；其余路径不建 Release，跳过
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          elif [ -n "$DISPATCH_RELEASE_TAG" ]; then
            release_tag="$DISPATCH_RELEASE_TAG"
          else
            echo "非发布路径（PR / 未带 release_tag 的 dispatch），跳过版本一致性校验。"
            exit 0
          fi

          expected_version="${release_tag#v}"
          crate_toml="crates/lk-cli/Cargo.toml"

          # 解析 crates/lk-cli 的有效 package version（CARGO_PKG_VERSION 口径）：
          # version.workspace = true 时继承根 Cargo.toml 的 [workspace.package] version
          if grep -q '^version\.workspace[[:space:]]*=' "$crate_toml"; then
            crate_version="$(awk -F'"' '/^\[workspace\.package\]/{p=1; next} /^\[/{p=0} p && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          else
            crate_version="$(awk -F'"' '/^\[package\]/{p=1; next} /^\[/{p=0} p && /^version[[:space:]]*=/{print $2; exit}' "$crate_toml")"
          fi

          echo "release tag      : $release_tag (版本号: $expected_version)"
          echo "lk-cli 版本(Cargo): $crate_version"

          if [ "$expected_version" != "$crate_version" ]; then
            echo "::error::发布 tag '$release_tag'（版本 $expected_version）与 crates/lk-cli 的 package version '$crate_version' 不一致——二进制 --version 输出来自后者，不一致会导致排障混淆（issue #34）。"
            echo "::error::修复方式二选一："
            echo "::error::  1) 把版本更新为 $expected_version（当前经 workspace 继承，改根 Cargo.toml [workspace.package] 的 version），提交后删除并重新推送该 tag；"
            echo "::error::  2) 若 tag 有误，改为推送与 crate 版本一致的 vX.Y.Z tag 后重跑本工作流。"
            exit 1
          fi
          echo "✅ 版本一致：$expected_version == $crate_version"

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    needs: check-version
    permissions:
      contents: write # softprops/action-gh-release 创建 Release 并上传附件（仅本 job 需要）
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ---- 质量门禁（2026-08-27 起 CI 只在 release 运行，检查前置）----
      - name: Format check
        run: cargo fmt --all -- --check

      # `--locked`：manifest 与 Cargo.lock 漂移即失败。不带它时 cargo 会在
      # CI 里静默重写锁文件，于是「改了 Cargo.toml 忘提交锁文件」永远绿灯
      # （v0.1.13 实际发生过：#94 升了 [workspace.package] version，锁文件
      # 还停在 0.1.12，一路过闸）。锁文件是发布可复现性的一部分，漂移必须在
      # 门禁上响，不能在 CI 里被悄悄抹平。
      - name: Clippy (core + daemon + cli)
        run: cargo clippy --locked -p lk-core -p lk-daemon -p lk-cli --all-targets -- -D warnings

      - name: Test (core + daemon + cli)
        run: cargo test --locked -p lk-core -p lk-daemon -p lk-cli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test frontend (D 层事件总线单测)
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Cache tauri-cli binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/tauri-cli
          key: tauri-cli-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Install tauri-cli
        shell: bash
        run: |
          if [ ! -x "$RUNNER_TOOL_CACHE/tauri-cli/cargo-tauri.exe" ]; then
            cargo install tauri-cli --locked --version "^2"
            mkdir -p "$RUNNER_TOOL_CACHE/tauri-cli"
            cp "$HOME/.cargo/bin/cargo-tauri.exe" "$RUNNER_TOOL_CACHE/tauri-cli/"
          else
            echo "tauri-cli restored from cache"
          fi
          echo "$RUNNER_TOOL_CACHE/tauri-cli" >> "$GITHUB_PATH"

      # 先建独立 CLI：tauri.conf.json 的 bundle.resources 把该 exe 捆进安装包
      - name: Build standalone CLI (lk.exe)
        run: cargo build --locked --release -p lk-cli

      # `cargo tauri build` 不加 --locked：tauri CLI 不保证透传，且其上游
      # 步骤已用 --locked 把过漂移；发布产物构建保持原样，避免引入 CLI
      # 版本相关的构建差异。
      - name: Build installers (NSIS + MSI, 捆绑 lk.exe 到安装目录)
        run: cargo tauri build
        working-directory: crates/lk-app

      - name: Collect artifacts with versioned names
        shell: pwsh
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # 版本号：tag 触发取 tag、手动补发取 release_tag（均去 v 前缀），否则回退 tauri.conf.json
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:DISPATCH_RELEASE_TAG) {
            $env:DISPATCH_RELEASE_TAG -replace '^v', ''
          } else {
            (Get-Content 'crates/lk-app/tauri.conf.json' -Raw | ConvertFrom-Json).version
          }
          New-Item -ItemType Directory -Force 'artifacts' | Out-Null
          $files = @(Get-ChildItem 'target/release/bundle/nsis' -Filter '*-setup.exe' -ErrorAction SilentlyContinue) + `
                   @(Get-ChildItem 'target/release/bundle/msi' -Filter '*.msi' -ErrorAction SilentlyContinue)
          foreach ($f in $files) {
            $name = if ($f.FullName -like '*nsis*') {
              "LightKey-$version-windows-x86_64-setup.exe"
            } else {
              "LightKey-$version-windows-x86_64.msi"
            }
            Copy-Item $f.FullName (Join-Path 'artifacts' $name)
          }
          Copy-Item 'target/release/lk.exe' (Join-Path 'artifacts' "lk-cli-$version-windows-x86_64.exe")
          Get-ChildItem 'artifacts' | Select-Object Name, Length

      # 仅 dispatch 留 artifact（PR 运行不传，省私有仓库存储配额；tag 挂 Release）
      - name: Upload artifacts as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LightKey-windows-installers
          path: artifacts/
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            LightKey ${{ github.ref_name }} 发布产物：

            - `LightKey-*-windows-x86_64-setup.exe` / `LightKey-*-windows-x86_64.msi`：Windows 安装包（NSIS / MSI；未签名，SmartScreen 警告属预期；安装目录内含独立 `lk.exe`）
            - `lk-cli-*-windows-x86_64.exe`：独立 `lk` 命令行工具（亦随安装包装入安装目录）——无需安装 GUI，纯命令行使用；`lk --help` 查看全部命令，详见 docs/cli.md
            - `lk-cli-*-linux-x86_64`：Linux 原生 `lk` CLI（WSL2 内经 bridge 连接 Windows 桌面守护实例，见 docs/cross-subsystem.md）

  build-linux-cli:
    name: Build Linux CLI (lk)
    runs-on: ubuntu-latest
    needs: check-version
    permissions:
      contents: write # 与 Windows job 对齐：tag 触发时需向 Release 追加上传附件
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 与 Windows job 缓存隔离（不同 target/OS）
          key: linux-cli

      # ---- 质量门禁（2026-08-27 起 CI 只在 release 运行，检查前置；
      # Linux 是 WSL2 CLI 的发布目标，MSVC 视角覆盖不到，检查随构建做）----
      # 同 Windows job：`--locked` 让 manifest/lock 漂移在门禁上失败。
      - name: Clippy (cli)
        run: cargo clippy --locked -p lk-cli --all-targets -- -D warnings

      - name: Test (cli)
        run: cargo test --locked -p lk-cli

      - name: Build Linux CLI (x86_64-unknown-linux-gnu)
        run: cargo build --locked --release -p lk-cli --target x86_64-unknown-linux-gnu

      - name: Collect artifact with versioned name
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # 版本号：与 Windows job 同逻辑——tag 触发取 tag、手动补发取 release_tag（均去 v 前缀），否则回退 tauri.conf.json
          version="$(jq -r .version crates/lk-app/tauri.conf.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$DISPATCH_RELEASE_TAG" ]; then
            version="${DISPATCH_RELEASE_TAG#v}"
          fi
          mkdir artifacts
          cp target/x86_64-unknown-linux-gnu/release/lk "artifacts/lk-cli-${version}-linux-x86_64"
          ls -l artifacts/

      # 仅 dispatch 留 artifact（与 Windows job 同口径）
      - name: Upload artifacts as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LightKey-linux-cli
          path: artifacts/
          if-no-files-found: error

      # 与 Windows job 并行发布同一 Release：action 对已存在的 tag Release 追加上传附件。
      # 极小概率两 job 同时首次建 Release 触发竞态，失败重跑本 job 即可（幂等）。
      - name: Publish to GitHub Release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
