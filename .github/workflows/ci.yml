# LightKey CI（骨架）
#
# 验收平台：Windows + macOS 为验收平台，Linux 冒烟不阻塞。
#   - Linux：核心 + CLI（fmt / clippy / test）+ 前端构建
#   - Windows / macOS：全 workspace `cargo check`（含 Tauri 壳）
# Tauri 应用在 Linux 的完整构建需要 webkit2gtk 系统依赖，M2 接入桌面壳时
# 补充 Linux 冒烟 job（当前 Linux 已覆盖核心 + 前端，不阻塞）。

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-cli-linux:
    name: core + cli (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (core + cli)
        run: cargo clippy -p lk-core -p lk-cli --all-targets -- -D warnings

      - name: Test (core + cli)
        run: cargo test -p lk-core -p lk-cli

  frontend:
    name: frontend (React + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  desktop-windows:
    name: desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

  desktop-macos:
    name: desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace
