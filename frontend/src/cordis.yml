# cordis.yml —— 应用数据（随应用发布的声明式装配契约）
# docs/plugin-architecture.md §6.2
#
# 只描述「用哪个插件、怎么组合、传什么配置」；不含逻辑；运行时不可变。
# 条目字段：name（插件名，注册表 key）/ config（插件配置，经 @cordisjs/schema
# 校验）/ slot（槽位）/ order（槽位内顺序）/ page（content 页面路由）。
# 无 slot 的插件是服务（ipc-bridge / preference-store / theme / toast /
# approval / desktop-shell），被其他插件 inject 消费，不直接占槽位。
# M2：ui-* 五插件挂 content（ui-unlock 为锁态整页，宿主按 session 切换）；
# approval / desktop-shell 为服务插件。

# 服务（地基）
- name: ipc-bridge
- name: preference-store
- name: theme
  config:
    defaultTheme: dark
- name: toast

# 槽位组件（组件 = 插件条目；slot/order = 布局数据）
# sidebar：导航项（导航项本身也是组件）+ 底部锁定
- name: nav-vault
  slot: sidebar
  order: 1
  page: vault
- name: nav-rules
  slot: sidebar
  order: 2
  page: rules
- name: nav-settings
  slot: sidebar
  order: 3
  page: settings
- name: nav-audit
  slot: sidebar
  order: 4
  page: audit
- name: lock
  slot: sidebar
  order: 99

# topbar：搜索 + 同步状态 + 主题切换
- name: search
  slot: topbar
  order: 1
- name: sync-status
  slot: topbar
  order: 2
- name: theme-toggle
  slot: topbar
  order: 3

# content：页面（M2 由 ui-* 插件挂载；M2.5 增 ui-onboarding 首启向导）
# ui-onboarding：锁态整页（page=onboarding，宿主按 session.initialized 门控；
#   无库 → 向导，有库 → 解锁页，与 ui-unlock 互斥）
- name: ui-onboarding
  slot: content
  order: 0
  page: onboarding
# ui-unlock：锁态整页（page=unlock，宿主锁态单独渲染，无三栏）
- name: ui-unlock
  slot: content
  order: 1
  page: unlock
- name: ui-vault
  slot: content
  order: 10
  page: vault
- name: ui-rules
  slot: content
  order: 20
  page: rules
- name: ui-settings
  slot: content
  order: 30
  page: settings
- name: ui-audit
  slot: content
  order: 40
  page: audit

# 服务（无槽位；M2 桌面层）
- name: approval
- name: desktop-shell
